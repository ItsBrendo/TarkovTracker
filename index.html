<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarkov Tracker</title>
    <style>
      :root {
        --bg: #101820;
        --panel: #18232d;
        --panel-alt: #1d2d3a;
        --text: #eaf2f8;
        --muted: #a6b9c8;
        --accent: #7ad7ff;
        --accent-strong: #53c7ff;
        --success: #59d98d;
        --danger: #ff7f7f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #0d141c 0%, #101820 100%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 0 24px;
        flex-wrap: wrap;
      }

      .nav-brand {
        font-size: 1.5rem;
        font-weight: 700;
      }

      .nav-links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .nav-links a {
        color: var(--text);
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .nav-links a.active {
        background: rgba(122, 215, 255, 0.12);
        border-color: rgba(122, 215, 255, 0.5);
      }

      .header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: end;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 2.2rem;
      }

      .subtitle {
        color: var(--muted);
        margin-top: 8px;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button, .button-link {
        background: var(--accent);
        color: #07141d;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }

      button:hover, .button-link:hover { opacity: 0.94; }

      .button-secondary {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.2);
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: 700;
        margin-top: 10px;
      }

      .status {
        margin-bottom: 16px;
        color: var(--muted);
        min-height: 24px;
      }

      .error {
        color: var(--danger);
        display: none;
        margin-bottom: 12px;
      }

      .error.show {
        display: block;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }

      th, td {
        padding: 12px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        text-align: left;
      }

      th {
        color: var(--muted);
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .list-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }

      @media (max-width: 640px) {
        .stats { grid-template-columns: 1fr; }
        th, td { font-size: 0.9rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <div class="nav-brand">Tarkov Tracker</div>
        <div class="nav-links">
          <a href="index.html" class="active">Dashboard</a>
          <a href="items.html">Items</a>
          <a href="compare.html">Compare</a>
        </div>
      </nav>

      <header class="header">
        <div>
          <h1>Market overview</h1>
          <div class="subtitle">Track item value trends and identify the most active prices.</div>
        </div>
        <div class="actions">
          <a class="button-link" href="items.html">Open item list</a>
          <a class="button-link button-secondary" href="compare.html">Compare items</a>
        </div>
      </header>

      <section class="stats">
        <div class="card">
          <div class="stat-label">Tracked items</div>
          <div class="stat-value" id="tracked-count">10</div>
        </div>
        <div class="card">
          <div class="stat-label">Best value</div>
          <div class="stat-value" id="best-value">—</div>
        </div>
        <div class="card">
          <div class="stat-label">Status</div>
          <div class="stat-value" id="status-pill">Live</div>
        </div>
      </section>

      <div class="card">
        <div class="status" id="status">Ready.</div>
        <div class="error" id="error"></div>

        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Base price</th>
              <th>Average 24h</th>
              <th>Last low</th>
            </tr>
          </thead>
          <tbody id="items"></tbody>
        </table>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const itemsEl = document.getElementById('items');
      const trackedCountEl = document.getElementById('tracked-count');
      const bestValueEl = document.getElementById('best-value');
      const statusPillEl = document.getElementById('status-pill');

      function renderSummary(items) {
        if (!items.length) {
          trackedCountEl.textContent = '0';
          bestValueEl.textContent = '—';
          return;
        }

        trackedCountEl.textContent = String(items.length);

        const bestItem = [...items].sort((a, b) => {
          const aValue = Number(a.avg24hPrice || 0);
          const bValue = Number(b.avg24hPrice || 0);
          return bValue - aValue;
        })[0];

        bestValueEl.textContent = bestItem ? `${bestItem.name} / ${TarkovTracker.formatPrice(bestItem.avg24hPrice)}` : '—';
      }

      async function loadItems() {
        statusEl.textContent = 'Loading data...';
        errorEl.textContent = '';
        errorEl.classList.remove('show');
        itemsEl.innerHTML = '';

        try {
          const items = await TarkovTracker.fetchItems();
          renderSummary(items);

          if (!items.length) {
            statusEl.textContent = 'No items returned.';
            return;
          }

          items.forEach((item) => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${item.name || 'Unknown item'}</td>
              <td>${TarkovTracker.formatPrice(item.basePrice)}</td>
              <td>${TarkovTracker.formatPrice(item.avg24hPrice)}</td>
              <td>${TarkovTracker.formatPrice(item.lastLowPrice)}</td>
            `;
            itemsEl.appendChild(row);
          });

          statusEl.textContent = `Loaded ${items.length} items.`;
          statusPillEl.textContent = 'Live';
        } catch (error) {
          console.error(error);
          statusPillEl.textContent = 'Fallback';
          statusEl.textContent = 'Showing offline fallback data.';
          itemsEl.innerHTML = '';

          TarkovTracker.fallbackItems.forEach((item) => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${item.name || 'Unknown item'}</td>
              <td>${TarkovTracker.formatPrice(item.basePrice)}</td>
              <td>${TarkovTracker.formatPrice(item.avg24hPrice)}</td>
              <td>${TarkovTracker.formatPrice(item.lastLowPrice)}</td>
            `;
            itemsEl.appendChild(row);
          });

          renderSummary(TarkovTracker.fallbackItems);
          const reason = error instanceof Error ? error.message : 'Unknown fetch error';
          errorEl.textContent = `The live Tarkov API is not responding (${reason}). Showing cached fallback data.`;
          errorEl.classList.add('show');
        }
      }

      loadItems();
    </script>
  </body>
</html>
