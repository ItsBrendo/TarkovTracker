<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarkov Tracker</title>
    <style>
      :root {
        --bg: #101820;
        --panel: #18232d;
        --text: #eaf2f8;
        --muted: #a6b9c8;
        --accent: #7ad7ff;
        --danger: #ff7f7f;
        --good: #59d98d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #0d141c 0%, #101820 100%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 2rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.2);
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        color: var(--accent);
      }

      .status {
        color: var(--muted);
        min-height: 24px;
        margin-bottom: 12px;
      }

      .error {
        display: none;
        color: var(--danger);
        background: rgba(255,127,127,0.08);
        padding: 10px 12px;
        border: 1px solid rgba(255,127,127,0.25);
        border-radius: 8px;
        margin-bottom: 12px;
      }

      .error.visible {
        display: block;
      }

      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      #items-list {
        max-height: 520px;
        overflow-y: auto;
        padding-right: 6px;
      }

      .list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }

      .list strong {
        color: var(--accent);
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Live Tarkov Data</h1>

      <div class="layout">
        <section class="card">
          <h2>Player</h2>
          <div id="player-status" class="status">Loading player data...</div>
          <div id="player-error" class="error"></div>
          <ul id="player-list" class="list"></ul>
        </section>

        <section class="card">
          <h2>Items</h2>
          <div id="items-status" class="status">Loading item data...</div>
          <div id="items-error" class="error"></div>
          <ul id="items-list" class="list"></ul>
        </section>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      const playerStatusEl = document.getElementById('player-status');
      const playerErrorEl = document.getElementById('player-error');
      const playerListEl = document.getElementById('player-list');

      const itemsStatusEl = document.getElementById('items-status');
      const itemsErrorEl = document.getElementById('items-error');
      const itemsListEl = document.getElementById('items-list');

      function showError(el, message) {
        el.textContent = message;
        el.classList.add('visible');
      }

      function clearError(el) {
        el.textContent = '';
        el.classList.remove('visible');
      }

      function renderPlayerSummary(data) {
        playerListEl.innerHTML = '';

        if (!data) {
          playerListEl.innerHTML = '<li><span class="muted">No player data available.</span></li>';
          return;
        }

        const rows = [
          ['Nickname', data.nickname || 'Unknown'],
          ['Side', data.side || 'Unknown'],
          ['Experience', Number(data.experience || 0).toLocaleString()],
          ['PMC Sessions', Number(data.pmcSessions || 0)],
          ['PMC Kills', Number(data.pmcKills || 0)],
          ['PMC Deaths', Number(data.pmcDeaths || 0)],
          ['PMC Survived', Number(data.pmcSurvived || 0)],
          ['Scav Kills', Number(data.scavKills || 0)],
          ['Playtime', `${Number(data.totalPlaytimeSeconds || 0)} sec`],
          ['Battle Pass', `${Number(data.battlePassCompleted || 0)}/${Number(data.battlePassTotal || 0)}`]
        ];

        rows.forEach(([label, value]) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${label}</span><strong>${value}</strong>`;
          playerListEl.appendChild(li);
        });
      }

      async function loadPlayer() {
        const params = new URLSearchParams(window.location.search);
        const accountId = params.get('accountId') || '1192376';
        const gameMode = params.get('gameMode') || 'pve';
        const token = params.get('token') || '';

        const workerUrl = `${TarkovTracker.PROXY_URL}/player?accountId=${encodeURIComponent(accountId)}&gameMode=${encodeURIComponent(gameMode)}`;

        if (!token) {
          playerStatusEl.textContent = 'Waiting for private player token.';
          showError(playerErrorEl, 'Player data unavailable: add ?accountId=1192376&gameMode=pve&token=YOUR_TOKEN to the URL.');
          return;
        }

        try {
          playerStatusEl.textContent = 'Loading player data...';
          clearError(playerErrorEl);

          const response = await fetch(`${workerUrl}&token=${encodeURIComponent(token)}`, {
            headers: {
              Accept: 'application/json'
            }
          });

          const payload = await response.json();

          if (!response.ok || !payload?.data) {
            throw new Error(payload?.error || 'Player fetch failed.');
          }

          playerStatusEl.textContent = 'Player loaded.';
          renderPlayerSummary(payload.data);
        } catch (error) {
          playerStatusEl.textContent = 'Player data unavailable.';
          showError(playerErrorEl, error instanceof Error ? error.message : 'Unknown player fetch error.');
          renderPlayerSummary(null);
        }
      }

      function displayItemName(item) {
        const rawName = typeof item?.name === 'string' ? item.name.trim() : '';
        const normalizedName = typeof item?.normalizedName === 'string' ? item.normalizedName.trim() : '';

        if (rawName && !/^[0-9a-f]{24}(?:\s+(?:Name|ShortName))?$/i.test(rawName)) {
          return rawName;
        }

        if (normalizedName) {
          return normalizedName
            .split(/[-_]+/)
            .filter(Boolean)
            .map((part) => {
              if (part.toLowerCase() === 'x' || /^\d+x\d+$/i.test(part)) {
                return part.toUpperCase();
              }
              if (/^\d+$/i.test(part)) {
                return part;
              }
              return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
            })
            .join(' ');
        }

        return rawName || 'Unknown item';
      }

      function renderItems(items) {
        itemsListEl.innerHTML = '';

        if (!items.length) {
          itemsListEl.innerHTML = '<li><span class="muted">No item data returned.</span></li>';
          return;
        }

        items.forEach((item) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${displayItemName(item)}</span><strong>${TarkovTracker.formatPrice(item.basePrice ?? item.avg24hPrice ?? item.lastLowPrice)}</strong>`;
          itemsListEl.appendChild(li);
        });
      }

      async function loadItems() {
        try {
          itemsStatusEl.textContent = 'Loading item data...';
          clearError(itemsErrorEl);

          const response = await fetch('https://json.tarkov.dev/regular/items', {
            headers: {
              Accept: 'application/json'
            }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const payload = await response.json();
          const itemMap = payload?.data?.items && typeof payload.data.items === 'object' ? Object.values(payload.data.items) : Array.isArray(payload) ? payload : [];

          if (!itemMap.length) {
            throw new Error('No item records returned from the live API.');
          }

          itemsStatusEl.textContent = `Loaded ${itemMap.length} items.`;
          renderItems(itemMap);
        } catch (error) {
          itemsStatusEl.textContent = 'Item data unavailable.';
          showError(itemsErrorEl, error instanceof Error ? error.message : 'Unknown item fetch error.');
          itemsListEl.innerHTML = '<li><span class="muted">Error loading items.</span></li>';
        }
      }

      loadPlayer();
      loadItems();
    </script>
  </body>
</html>
