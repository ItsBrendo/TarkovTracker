# Generate the catalog, migrate D1, and deploy the Pages Functions and assets.
name: Deploy Goons from Gumtree

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Tarkov.dev item catalog
        env:
          TARKOV_API_URL: https://json.tarkov.dev/regular/items
        run: |
          curl --compressed --fail --silent --show-error --retry 3 --retry-all-errors \
            -H 'Accept: application/json' \
            "$TARKOV_API_URL" --output api-response.json
          if ! jq -e '.data.items | type == "object" and length > 0' api-response.json >/dev/null; then
            jq -r '.error // .message // "The Tarkov.dev REST endpoint returned no items."' api-response.json >&2
            exit 1
          fi
          jq '{
            generatedAt: (now | todateiso8601),
            items: [
              .data.items[] | {
                id, name, shortName, normalizedName, iconLink, wikiLink, types,
                width, height, weight, basePrice, avg24hPrice, lastLowPrice,
                imageLink: (.image512pxLink // .baseImageLink // .gridImageLink // .iconLink)
              } | select(.id != null and (.name != null or .normalizedName != null))
            ]
          }' api-response.json > items.json
          for endpoint in tasks maps traders hideout crafts barters; do
            curl --compressed --fail --silent --show-error --retry 3 --retry-all-errors \
              -H 'Accept: application/json' \
              "https://json.tarkov.dev/regular/${endpoint}" --output "${endpoint}.json"
          done
          jq -n \
            --slurpfile items api-response.json \
            --slurpfile tasks tasks.json \
            --slurpfile maps maps.json \
            --slurpfile traders traders.json \
            --slurpfile hideout hideout.json \
            --slurpfile crafts crafts.json \
            --slurpfile barters barters.json \
            '{
              generatedAt: (now | todateiso8601),
              items: ($items[0].data.items | length),
              itemCategories: ($items[0].data.itemCategories | length),
              handbookCategories: ($items[0].data.handbookCategories | length),
              fleaMarketUnlock: $items[0].data.fleaMarket.minPlayerLevel,
              armorMaterials: ($items[0].data.armorMaterials | length),
              playerLevels: ($items[0].data.playerLevels | length),
              skills: ($items[0].data.skills | length),
              masteryGroups: ($items[0].data.mastering | length),
              specialItems: ($items[0].data.specialItems | length),
              tasks: (($tasks[0].data.tasks // $tasks[0].data) | length),
              maps: (($maps[0].data.maps // $maps[0].data) | length),
              traders: (($traders[0].data.traders // $traders[0].data) | length),
              hideoutAreas: (($hideout[0].data.hideout // $hideout[0].data) | length),
              crafts: ($crafts[0].data | length),
              barters: ($barters[0].data | length)
            }' > game-data.json
          rm api-response.json tasks.json maps.json traders.json hideout.json crafts.json barters.json
      - name: Apply D1 migrations and deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 d1 migrations apply goons-from-gumtree-users --remote
          npx wrangler@4 pages deploy . --project-name goons-from-gumtree --branch main
