# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Refresh the same-origin catalog once per day.
  schedule:
    - cron: "23 6 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Tarkov.dev item catalog
        env:
          TARKOV_API_URL: https://json.tarkov.dev/regular/items
        run: |
          curl --compressed --fail --silent --show-error --retry 3 --retry-all-errors \
            -H 'Accept: application/json' \
            "$TARKOV_API_URL" --output api-response.json
          if ! jq -e '.data.items | type == "object" and length > 0' api-response.json >/dev/null; then
            jq -r '.error // .message // "The Tarkov.dev REST endpoint returned no items."' api-response.json >&2
            exit 1
          fi
          jq '{
            generatedAt: (now | todateiso8601),
            items: [
              .data.items[] | {
                id, name, shortName, normalizedName, iconLink, wikiLink, types,
                width, height, weight, basePrice, avg24hPrice, lastLowPrice,
                imageLink: (.image512pxLink // .baseImageLink // .gridImageLink // .iconLink)
              } | select(.id != null and (.name != null or .normalizedName != null))
            ]
          }' api-response.json > items.json
          rm api-response.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
