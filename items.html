<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarkov Tracker | Items</title>
    <style>
      :root {
        --bg: #101820;
        --panel: #18232d;
        --text: #eaf2f8;
        --muted: #a6b9c8;
        --accent: #7ad7ff;
        --danger: #ff7f7f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding-bottom: 22px;
        flex-wrap: wrap;
      }

      .nav-brand {
        font-size: 1.5rem;
        font-weight: 700;
      }

      .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .nav-links a {
        color: var(--text);
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .nav-links a.active {
        background: rgba(122, 215, 255, 0.12);
        border-color: rgba(122, 215, 255, 0.5);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      input {
        width: min(100%, 360px);
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.1);
        background: #101c26;
        color: var(--text);
      }

      button {
        background: var(--accent);
        color: #07141d;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.2);
      }

      .status {
        color: var(--muted);
        margin-bottom: 12px;
        min-height: 24px;
      }

      .error {
        display: none;
        color: var(--danger);
        margin-bottom: 12px;
      }

      .error.show { display: block; }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        padding: 12px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        text-align: left;
      }

      th {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <div class="nav-brand">Tarkov Tracker</div>
        <div class="nav-links">
          <a href="index.html">Dashboard</a>
          <a href="items.html" class="active">Items</a>
          <a href="compare.html">Compare</a>
        </div>
      </nav>

      <header class="header">
        <h1>Item browser</h1>
        <button id="loadButton">Load market data</button>
      </header>

      <div class="card">
        <div class="toolbar">
          <input id="itemFilter" type="text" placeholder="Filter items by name..." />
          <span id="resultCount" class="muted">0 items</span>
        </div>

        <div class="status" id="status">Ready.</div>
        <div class="error" id="error"></div>

        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Base price</th>
              <th>Average 24h</th>
              <th>Last low</th>
            </tr>
          </thead>
          <tbody id="items"></tbody>
        </table>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      const itemFilterEl = document.getElementById('itemFilter');
      const resultCountEl = document.getElementById('resultCount');
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const itemsEl = document.getElementById('items');
      const loadButton = document.getElementById('loadButton');
      let allItems = [];

      function renderItems(items) {
        const filterText = itemFilterEl.value.trim();
        const filtered = items.filter((item) => TarkovTracker.matchesFilter(item, filterText));

        itemsEl.innerHTML = '';
        filtered.forEach((item) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.name || 'Unknown item'}</td>
            <td>${TarkovTracker.formatPrice(item.basePrice)}</td>
            <td>${TarkovTracker.formatPrice(item.avg24hPrice)}</td>
            <td>${TarkovTracker.formatPrice(item.lastLowPrice)}</td>
          `;
          itemsEl.appendChild(row);
        });

        resultCountEl.textContent = `${filtered.length} item${filtered.length === 1 ? '' : 's'}`;
        statusEl.textContent = `Showing ${filtered.length} of ${items.length} items.`;
      }

      async function loadItems() {
        statusEl.textContent = 'Loading data...';
        errorEl.textContent = '';
        errorEl.classList.remove('show');

        try {
          allItems = await TarkovTracker.fetchItems();
          renderItems(allItems);
        } catch (error) {
          console.error(error);
          allItems = TarkovTracker.fallbackItems;
          renderItems(allItems);
          errorEl.textContent = 'The live Tarkov API is blocked right now, so this page is showing cached fallback data.';
          errorEl.classList.add('show');
        }
      }

      itemFilterEl.addEventListener('input', () => renderItems(allItems));
      loadButton.addEventListener('click', loadItems);
      loadItems();
    </script>
  </body>
</html>
